#
# The installers and the releases (commits 39f–g, 39i; docs/DESKTOP.md ›
# 39f–g, 39i; docs/INSTALL.md): what a person installs, each installed or
# run here as they would, then published for downloading.
#
#   Windows  gorani-store.msix              the Store's identity, unsigned — uploaded by hand to
#                                           Partner Center (a private audience); Microsoft signs it
#            gorani-windows-x64-unsigned.msix   Windows 11, Add-AppxPackage -AllowUnsigned
#            gorani-windows-x64.zip         the two programs, no install
#   macOS    gorani-macos-arm64-cli.tar.gz  gorani-sync and its keystore helper, unsigned
#            Gorani-macOS-arm64.zip         the app with its Finder integration — only when signed
#                                           (Developer ID: an extension cannot run unsigned)
#   Linux    gorani-linux-x64.tar.gz        gorani-sync and gorani-mount (FUSE), unsigned
#
# The unsigned files are checked by their users instead: SHA256SUMS lists
# them all, and the sign job signs it with the release key (the Actions
# secret RELEASE_SIGNING_KEY — tools/release/new-key.sh makes it), refusing
# a key that tools/release/allowed_signers does not pin. Users run
# tools/release/verify.sh / verify.ps1; each platform's job runs them
# against its own files with a throwaway key.
#
# Releases (tools/release/publish.sh): every build of main is a new release,
# marked Latest, the newest 10 kept; a v* tag is a release of its own,
# never deleted. Without the key a release still goes out, said to be
# unsigned (verify.sh refuses it).
#
# Settings, none ever asked for, none printed:
#   all      secret RELEASE_SIGNING_KEY — the release key (tools/release/new-key.sh)
#   Windows  variables STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_NAME — the
#            identity Partner Center assigns when the app name is reserved (public values)
#   macOS    GORANI_TEAM_ID (a variable or a secret), secrets APPLE_CERT_P12 (the Developer ID
#            Application identity, base64), APPLE_CERT_PASSWORD; to notarize as well,
#            APPLE_API_KEY (the App Store Connect .p8's text), APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#
# When: on main, whenever a push changes what the programs are built from
# (not a push of only the web app, the worker or the docs: the programs
# would be the same — and macOS minutes count ten times); on release tags
# (v*); by hand; and on pull requests that change the packaging itself,
# which build and check everything and only say what they would publish.
#
# Supply chain: first-party actions only; the platforms' own tools
# (makeappx, signtool, codesign, notarytool, ssh-keygen, gh). One tool comes
# from outside — XcodeGen, from the image's Homebrew — and it runs in a job
# of its own that holds no secret; the signing job takes only the project
# it generated, and refuses one with any script phase or build rule (a
# place a tampered generator could hide a command). The release key reaches
# only the sign job, which cannot write to the repository; only the
# publish job may write, and it never sees the key. Both run only for main
# and v* tags.

name: package

on:
  push:
    branches: [main]
    # (Path filters do not apply to tags: every v* tag builds.)
    tags: ["v*"]
    paths: ["clients/**", "crates/**", "Cargo.toml", "Cargo.lock", "tools/release/**", ".github/workflows/package.yml"]
  pull_request:
    paths: ["clients/windows/packaging/**", "clients/macos/packaging/**", "clients/macos/project.yml", "tools/release/**", ".github/workflows/package.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older run — except on main and tags, where a
# run that has started finishes (it may be publishing), and only a waiting
# one gives way to the newer.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows (Store package, unsigned MSIX, ZIP)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      STORE_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - name: Release builds
        run: cargo build --release --locked -p gorani-windows -p gorani-client-core --bin gorani-cloud --bin gorani-sync
      - name: Package
        shell: pwsh
        run: |
          # The version: a tag's (v1.2.3), else the workspace's. The Store
          # keeps a package's fourth number for itself (0); elsewhere it is
          # this run's, so each build installs over the last.
          $base = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $base = $Matches[1] }
          New-Item -ItemType Directory dist, store | Out-Null
          # Unsigned: Windows installs a package without a signature only if
          # its publisher carries this OID (and never as the signed identity).
          ./clients/windows/packaging/package.ps1 -Version "$base.${{ github.run_number }}" -Name Gorani.Client `
            -Publisher 'CN=Gorani Unsigned, OID.2.25.311729368913984317654407730594956997722=1' -Out dist/gorani-windows-x64-unsigned.msix
          Compress-Archive -Path target/release/gorani-cloud.exe, target/release/gorani-sync.exe, clients/windows/packaging/gorani.ico -DestinationPath dist/gorani-windows-x64.zip
          if ($env:STORE_NAME -and $env:STORE_PUBLISHER) {
            ./clients/windows/packaging/package.ps1 -Version "$base.0" -Name $env:STORE_NAME -Publisher $env:STORE_PUBLISHER `
              -PublisherDisplayName ($env:STORE_PUBLISHER_NAME ? $env:STORE_PUBLISHER_NAME : 'Gorani') -Out store/gorani-store.msix
          } else {
            Write-Output 'no Store identity yet (variables STORE_IDENTITY_NAME, STORE_PUBLISHER): no Store package this run'
          }
      - name: Install and run each, as a person would
        shell: pwsh
        run: |
          ./clients/windows/packaging/try-install.ps1 -Path dist/gorani-windows-x64-unsigned.msix -Name Gorani.Client -AllowUnsigned
          $z = Join-Path $env:RUNNER_TEMP 'zip'
          Expand-Archive dist/gorani-windows-x64.zip $z
          foreach ($cmd in 'gorani-cloud', 'gorani-sync') {
            $said = & (Join-Path $z "$cmd.exe") 2>&1 | Out-String
            if ($said -notmatch "usage: $cmd") { throw "$cmd from the ZIP did not answer: $said" }
            Write-Output "$cmd answers from the ZIP"
          }
          # The Store package as Microsoft's signature will make it: signed
          # here by a throwaway certificate of the same publisher, trusted on
          # this runner only — the uploaded file stays unsigned.
          if (Test-Path store/gorani-store.msix) {
            $dir = Join-Path $env:RUNNER_TEMP 'store-test'
            New-Item -ItemType Directory $dir | Out-Null
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:STORE_PUBLISHER -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
            $password = [guid]::NewGuid().ToString()
            Export-PfxCertificate -Cert $cert -FilePath "$dir/test.pfx" -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            Export-Certificate -Cert $cert -FilePath "$dir/test.cer" | Out-Null
            Import-Certificate -FilePath "$dir/test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            Copy-Item store/gorani-store.msix "$dir/store-test.msix"
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /f "$dir/test.pfx" /p $password "$dir/store-test.msix"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
            ./clients/windows/packaging/try-install.ps1 -Path "$dir/store-test.msix" -Name $env:STORE_NAME
          }
          $global:LASTEXITCODE = 0
      - name: The release check, on Windows (verify.ps1, a throwaway key)
        shell: pwsh
        run: ./tools/release/test-verify.ps1 -Files (Get-ChildItem dist -File).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          # (For Partner Center, by hand — not part of the release.)
          name: windows-store-upload
          path: store/gorani-store.msix
          if-no-files-found: ignore
          retention-days: 30

  macos-project:
    name: Xcode project (generated; no secrets in this job)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        working-directory: clients/macos
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: |
            clients/macos/Gorani.xcodeproj
            clients/macos/App/Info.plist
            clients/macos/App/Gorani.entitlements
            clients/macos/Extension/Info.plist
            clients/macos/Extension/GoraniFileProvider.entitlements
          retention-days: 1

  macos:
    name: The app (macOS)
    needs: macos-project
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.GORANI_TEAM_ID || secrets.GORANI_TEAM_ID }}
      HAVE_SIGNING: ${{ secrets.APPLE_CERT_P12 != '' && (vars.GORANI_TEAM_ID != '' || secrets.GORANI_TEAM_ID != '') }}
      HAVE_NOTARY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: clients/macos
      - name: The generated project runs nothing of its own
        run: |
          if grep -nE 'PBXShellScriptBuildPhase|PBXBuildRule|shellScript' clients/macos/Gorani.xcodeproj/project.pbxproj; then
            echo "::error::the generated project holds a script phase or build rule — refusing to build it here"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - name: Release builds (the core library, the CLI, the keystore helper)
        run: |
          cargo build --release --locked -p gorani-macos --lib
          cargo build --release --locked -p gorani-client-core --bin gorani-sync
          (cd clients/macos/GoraniKit && swift build -c release --product gorani-keystore)
      - name: Build the app and its extension
        working-directory: clients/macos
        env:
          # (Package.swift links the core from here — the release build.)
          GORANI_LIB_DIR: ${{ github.workspace }}/target/release
        run: |
          prefix=""
          [ -n "$TEAM_ID" ] && prefix="$TEAM_ID."
          # (arm64 only: the core is built for it — Release would otherwise
          # build x86_64 too, and find no core to link there.)
          xcodebuild -project Gorani.xcodeproj -scheme Gorani -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO "TeamIdentifierPrefix=$prefix" "GORANI_TEAM_ID=$TEAM_ID" build
      - name: Assemble, sign, notarize
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          work="$RUNNER_TEMP/sign"
          mkdir -m 0700 "$work"
          keychain="$work/build.keychain-db"
          cleanup() {
            [ -f "$keychain" ] && security delete-keychain "$keychain" || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          if [ "$HAVE_SIGNING" = "true" ]; then
            kc_password=$(uuidgen)
            security create-keychain -p "$kc_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$kc_password" "$keychain"
            base64 --decode <<<"$P12" >"$work/cert.p12"
            security import "$work/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
            rm -f "$work/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
            [ -n "$SIGN_IDENTITY" ] || { echo "::error::no Developer ID Application identity in APPLE_CERT_P12"; exit 1; }
            export SIGN_IDENTITY
            if [ "$HAVE_NOTARY" = "true" ]; then
              printf '%s' "$API_KEY" >"$work/notary.p8"
              export NOTARY_KEY="$work/notary.p8" NOTARY_KEY_ID NOTARY_ISSUER
            fi
          fi
          bin=$(cd clients/macos/GoraniKit && swift build -c release --show-bin-path)
          clients/macos/packaging/package.sh clients/macos/build/Build/Products/Release/Gorani.app \
            target/release/gorani-sync "$bin/gorani-keystore" "$GITHUB_WORKSPACE/Gorani-macOS-arm64.zip"
      - name: The unsigned CLI and helper
        run: |
          mkdir -p dist cli unpacked
          bin=$(cd clients/macos/GoraniKit && swift build -c release --show-bin-path)
          cp target/release/gorani-sync "$bin/gorani-keystore" cli/
          tar -C cli -czf dist/gorani-macos-arm64-cli.tar.gz gorani-sync gorani-keystore
          # As a person gets it: unpacked, asked. (gorani-sync finds the
          # helper beside itself.)
          tar -C unpacked -xzf dist/gorani-macos-arm64-cli.tar.gz
          usage=$(unpacked/gorani-sync 2>&1 || true)
          grep -q "usage: gorani-sync" <<<"$usage" || { echo "the unpacked CLI does not answer: $usage"; exit 1; }
          unpacked/gorani-keystore probe
          # The app joins the release only signed: unsigned, its extension
          # cannot run (it stays a test artifact below).
          if [ "$HAVE_SIGNING" = "true" ]; then mv Gorani-macOS-arm64.zip dist/; fi
      - name: The release check, on macOS (verify.sh, a throwaway key)
        run: tools/release/test-verify.sh dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.HAVE_SIGNING != 'true'
        with:
          name: macos-app-unsigned-test
          path: Gorani-macOS-arm64.zip
          retention-days: 7

  linux:
    name: Linux (gorani-sync, gorani-mount)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - name: Release builds
        # (Built on the image's Ubuntu: they need its glibc or newer.
        # gorani-mount is pure Rust — fuser without libfuse — and mounts
        # through fusermount3.)
        run: cargo build --release --locked -p gorani-client-core -p gorani-linux --bin gorani-sync --bin gorani-mount
      - name: Pack, unpack and run each, as a person would
        run: |
          mkdir -p dist unpacked
          tar -C target/release -czf dist/gorani-linux-x64.tar.gz gorani-sync gorani-mount
          tar -C unpacked -xzf dist/gorani-linux-x64.tar.gz
          for cmd in gorani-sync gorani-mount; do
            said=$("unpacked/$cmd" 2>&1 || true)
            grep -q "usage: $cmd" <<<"$said" || { echo "$cmd from the tarball did not answer: $said"; exit 1; }
            echo "$cmd answers from the tarball"
          done
      - name: The release check, on Linux (verify.sh, a throwaway key)
        run: tools/release/test-verify.sh dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          retention-days: 14

  checksums:
    name: SHA256SUMS (and the check, over the whole release)
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          files=$(ls dist)
          tools/release/test-verify.sh $(printf 'dist/%s ' $files)
          (cd dist && sha256sum $files >SHA256SUMS)
          cat dist/SHA256SUMS
      - name: What main would publish (a pull request publishes nothing)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish.sh --dry-run dist
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          retention-days: 30

  sign:
    name: SHA256SUMS signed with the release key
    needs: checksums
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Sign, then check it as a user would
        id: sign
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::no RELEASE_SIGNING_KEY secret: this release goes out without SHA256SUMS.sig, and verify.sh refuses it (tools/release/new-key.sh makes the key)"
            echo "signed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          work=$(mktemp -d "$RUNNER_TEMP/key.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          # (A key pasted on Windows may carry CRs, which OpenSSH refuses.)
          (umask 077 && printf '%s\n' "$KEY" | tr -d '\r' >"$work/key")
          ssh-keygen -Y sign -f "$work/key" -n gorani-release dist/SHA256SUMS
          # The user's own check, with the key the repository pins: a
          # signature nobody can check is worse than none.
          tools/release/verify.sh --signers tools/release/allowed_signers dist || {
            echo "::error::RELEASE_SIGNING_KEY is not the key tools/release/allowed_signers pins — commit the line tools/release/new-key.sh wrote there"
            exit 1
          }
          echo "signed=true" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          retention-days: 30

  publish:
    name: The release (Latest), for downloading
    needs: [checksums, sign]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # (One at a time: two quick pushes to main must not race each other's
    # count of the builds kept.)
    concurrency:
      group: package-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.sign.outputs.signed == 'true'
        with:
          name: signature
          path: dist
      - name: Publish (tools/release/publish.sh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish.sh dist
