# The client core (docs/DESKTOP.md): the protocol against the running
# worker, the sealed formats from crates/formats (the SAME implementation
# the worker and the vectors use), and a thin CLI. Platform shells arrive
# next; everything here is platform-neutral.

[package]
name = "gorani-client-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
gorani-formats = { path = "../../crates/formats" }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
sha2 = "0.10" # streamed SHA-256 for large files (transfer.rs, commit 33b)
# Identity keys (identity.rs, commit 33c): ECDSA P-256 as WebCrypto signs
# it, and the HMAC over the identity record. The same RustCrypto crates the
# formats crate already builds on.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
hmac = "0.12"
# The device secret from its parts (devicekey.rs, commit 34).
hkdf = "0.12"

[[bin]]
name = "gorani-sync"
path = "src/bin/gorani-sync.rs"