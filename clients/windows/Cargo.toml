[package]
name = "gorani-windows"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
gorani-client-core = { path = "../core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_CorrelationVector", "Win32_Security", "Win32_System_Console"] }

[[bin]]
name = "gorani-cloud"
path = "src/main.rs"
