# The MP4 engine of the video sidecar (src/lib.rs, docs/VIDEO.md): the
# author's mp4-hls-core, vendored and trimmed (no FairPlay, AES-HLS, DASH or
# token code — and so none of their crypto dependencies). Pure Rust, no
# platform code: the browser runs it as WASM (crates/media-wasm), the native
# clients link it directly.

[package]
name = "gorani-media"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[features]
fixtures = []
