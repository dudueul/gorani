<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The strict Content-Security-Policy (default-src 'none'; self only;
		     Trusted Types) arrives as a HEADER from public/_headers — static
		     assets are served by the platform, not the Worker, so a header the
		     Worker set would never reach this page (docs/SECURITY-REVIEW.md ›
		     O1; the e2e suite asserts it is delivered). There is no inline
		     script or style: the module below is the only script, served
		     same-origin and hashed. -->
		<meta name="color-scheme" content="dark" />
		<meta name="robots" content="noindex" />
		<title>Gorani</title>
	</head>
	<body class="h-full bg-neutral-950 text-neutral-100 antialiased">
		<!-- The whole app is one custom element tree. Nothing renders before
		     the vault is unlocked except the lock screen (src/app-root.ts). -->
		<gorani-app></gorani-app>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
