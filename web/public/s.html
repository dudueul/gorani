<!--
	The share recipient page (self-contained, no sign-in): the link is
	/s/f/<id>#<secret> — the part after # never reaches any server, so the
	keys derived from it (GS01: data key + meta key) exist only here. The
	server holds the sealed copy, the sealed meta, the Argon2id settings
	(password links) and a download counter; this page opens the name and
	assembles the file from GC1 frames in the browser. Password-protected
	links need BOTH the link and the password — the password is stretched
	(Argon2id) and mixed into the key material here, and is never sent.
-->
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="robots" content="noindex" />
		<title>Shared file · Gorani</title>
		<style>
			body { font-family: system-ui, sans-serif; }
			:root { --accent: oklch(0.72 0.17 145); }
		</style>
	</head>
	<body class="h-full bg-neutral-950 text-neutral-100">
		<div id="app" class="flex h-full items-center justify-center px-6">
			<section class="w-full max-w-md rounded-2xl border border-neutral-800 bg-neutral-900 p-6 text-center shadow-xl">
				<p class="text-sm font-semibold" style="color: var(--accent)">Gorani</p>
				<p id="status" class="mt-3 text-sm text-neutral-400">Opening the share…</p>
				<div id="pwform" class="mt-4 hidden">
					<p class="text-sm text-neutral-300">This link is password-protected.</p>
					<input id="pw" type="password" autocomplete="off" placeholder="Password" class="mt-3 w-full rounded-xl border border-neutral-700 bg-neutral-950 px-3 py-2 text-sm outline-none focus:border-[var(--accent)]" />
					<button id="unlock" class="mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-medium text-neutral-950 hover:opacity-90" style="background: var(--accent)">
						Unlock
					</button>
					<p class="mt-3 text-xs text-neutral-500">Stretched with Argon2id in this tab — the password is never sent.</p>
				</div>
				<div id="details" class="mt-4 hidden">
					<div id="icon" class="text-neutral-600"></div>
					<p id="name" class="mt-2 break-all text-lg font-medium"></p>
					<p id="meta" class="mt-1 text-xs text-neutral-500"></p>
					<button id="download" class="mt-5 w-full rounded-xl px-4 py-2.5 text-sm font-medium text-neutral-950 hover:opacity-90" style="background: var(--accent)">
						Download
					</button>
					<p class="mt-3 text-xs text-neutral-500">Decrypted in this browser — the server holds ciphertext only.</p>
				</div>
			</section>
		</div>
		<!-- Argon2id (hash-wasm, MIT — see NOTICE) sets globalThis.hashwasm. -->
		<script src="/vendor/argon2.umd.min.js"></script>
		<script type="module">
			import { splitFrame, frameAad } from "/gorani-media-lib.js";
			import { shareKeys, openShareMeta } from "/gorani-share-lib.js";

			const CHUNK = 8 * 1024 * 1024; // GC1 frames, one per part (GS01's contract)
			const status = document.getElementById("status");
			const say = (t) => (status.textContent = t);

			const id = location.pathname.split("/").pop();
			const secret = location.hash.startsWith("#") ? decodeURIComponent(location.hash.slice(1)) : "";

			let meta = null;
			let keys = null;

			async function show() {
				document.getElementById("name").textContent = meta.name;
				document.getElementById("meta").textContent = `${fmt(meta.size)} · expires ${new Date(info.expiresAt).toLocaleString()} · ${info.downloadsLeft} download${info.downloadsLeft === 1 ? "" : "s"} left`;
				document.getElementById("icon").innerHTML = kindIcon(meta.name);
				document.getElementById("details").classList.remove("hidden");
				say("");
			}

			/** The first key derivation, with whatever the server declared. */
			async function derive(password) {
				keys = await shareKeys(id, secret, password, info.kdf);
				meta = await openShareMeta(keys.meta, id, info.metaSealed);
				await show();
			}

			let info = null;
			try {
				if (!secret) throw new Error("This link is incomplete — the part after # is missing.");
				const mres = await fetch(`/s/f/${id}/meta`, { method: "GET" });
				if (!mres.ok) throw new Error((await mres.json().catch(() => ({}))).error ?? `link refused (${mres.status})`);
				info = await mres.json();
				if (!info.kdf) {
					await derive(null);
				} else {
					// Password links: ask here — the derivation needs BOTH the
					// link's secret and this password, and only this tab ever
					// sees either.
					document.getElementById("pwform").classList.remove("hidden");
					say("");
					document.getElementById("unlock").addEventListener("click", unlock);
					document.getElementById("pw").addEventListener("keydown", (e) => e.key === "Enter" && unlock());
				}
			} catch (e) {
				say(e instanceof Error ? e.message : String(e));
			}

			async function unlock() {
				const pw = document.getElementById("pw").value;
				if (!pw) return;
				const btn = document.getElementById("unlock");
				btn.disabled = true;
				say("Stretching the password…");
				try {
					await derive(pw);
					document.getElementById("pwform").classList.add("hidden");
				} catch (e) {
					// A wrong password is an AEAD failure in openShareMeta — say
					// exactly that, and let the recipient try again (the cost of
					// each try is the Argon2id stretch itself).
					say(e instanceof Error ? e.message : String(e));
					btn.disabled = false;
				}
			}

			document.getElementById("download").addEventListener("click", async () => {
				const btn = document.getElementById("download");
				btn.disabled = true;
				say("Downloading and decrypting…");
				try {
					await fetch(`/s/f/${id}/claim`, { method: "POST" });
					const res = await fetch(`/s/f/${id}/data`);
					if (!res.ok) throw new Error(`download refused (${res.status})`);
					const sealed = new Uint8Array(await res.arrayBuffer());
					const frames = Math.ceil(meta.size / CHUNK);
					const out = new Uint8Array(meta.size);
					let at = 0;
					for (let i = 0; i < frames; i++) {
						const f = i * (CHUNK + 28);
						const len = Math.min(CHUNK + 28, sealed.length - f);
						const { iv, body } = splitFrame(sealed, f, len);
						const plain = await crypto.subtle.decrypt(
							{ name: "AES-GCM", iv, additionalData: frameAad(i, i === frames - 1) },
							keys.data,
							body,
						);
						out.set(new Uint8Array(plain), at);
						at += plain.length;
						say(`Decrypting… ${Math.round((i / frames) * 100)}%`);
					}
					const url = URL.createObjectURL(new Blob([out], { type: meta.type || "application/octet-stream" }));
					const a = document.createElement("a");
					a.href = url;
					a.download = meta.name;
					a.click();
					setTimeout(() => URL.revokeObjectURL(url), 5000);
					say("Saved. The link's download count was used.");
				} catch (e) {
					say(e instanceof Error ? e.message : String(e));
				} finally {
					btn.disabled = false;
				}
			});

			function fmt(n) {
				if (n < 1024) return `${n} B`;
				const u = ["KB", "MB", "GB", "TB"];
				let v = n;
				let i = -1;
				do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
				return `${v.toFixed(1)} ${u[i]}`;
			}
			function kindIcon(name) {
				const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "";
				const glyph = { png: "🖼", jpg: "🖼", jpeg: "🖼", gif: "🖼", webp: "🖼", mp4: "🎬", mov: "🎬", mkv: "🎬", mp3: "🎵", m4a: "🎵", flac: "🎵", pdf: "📄", zip: "🗜", "7z": "🗜" }[ext];
				return `<span style="font-size:42px">${glyph ?? "📁"}</span>`;
			}
		</script>
	</body>
</html>
