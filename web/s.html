<!--
	The share recipient page (self-contained, no sign-in): the link is
	/s/f/<id>#<secret> — the part after # never reaches any server, so the
	keys derived from it (GS01: data key + meta key) exist only here. The
	server holds the sealed copy, the sealed meta, the Argon2id settings
	(password links) and a download counter; this page opens the name and
	assembles the file from GC1 frames in the browser. Password-protected
	links need BOTH the link and the password — the password is stretched
	(Argon2id) and mixed into the key material here, and is never sent.
-->
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="robots" content="noindex" />
		<title>Shared file · Gorani</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- Built by Vite (vite.config.ts › input.share): Tailwind's output for
		     this page. Before commit 24 the page sat in public/, copied verbatim,
		     so its Tailwind classes had no stylesheet at all. -->
		<link rel="stylesheet" href="/src/styles/share.css" />
	</head>
	<body class="h-full bg-neutral-950 text-neutral-100">
		<div id="app" class="flex h-full items-center justify-center px-6">
			<section class="w-full max-w-md rounded-2xl border border-neutral-800 bg-neutral-900 p-6 text-center shadow-xl">
				<p class="text-sm font-semibold text-[var(--color-accent)]">Gorani</p>
				<p id="status" class="mt-3 text-sm text-neutral-400">Opening the share…</p>
				<div id="pwform" class="mt-4 hidden">
					<p class="text-sm text-neutral-300">This link is password-protected.</p>
					<input id="pw" type="password" autocomplete="off" placeholder="Password" class="mt-3 w-full rounded-xl border border-neutral-700 bg-neutral-950 px-3 py-2 text-sm outline-none focus:border-[var(--color-accent)]" />
					<button id="unlock" class="mt-3 w-full rounded-xl bg-[var(--color-accent)] px-4 py-2.5 text-sm font-medium text-neutral-950 hover:opacity-90 disabled:opacity-50">
						Unlock
					</button>
					<p class="mt-3 text-xs text-neutral-500">Stretched with Argon2id in this tab — the password is never sent.</p>
				</div>
				<div id="details" class="mt-4 hidden">
					<div id="icon" class="text-[42px] leading-none"></div>
					<p id="name" class="mt-2 break-all text-lg font-medium"></p>
					<p id="meta" class="mt-1 text-xs text-neutral-500"></p>
					<button id="download" class="mt-5 w-full rounded-xl bg-[var(--color-accent)] px-4 py-2.5 text-sm font-medium text-neutral-950 hover:opacity-90 disabled:opacity-50">
						Download
					</button>
					<p class="mt-3 text-xs text-neutral-500">Decrypted in this browser — the server holds ciphertext only.</p>
				</div>
			</section>
		</div>
		<!-- Argon2id (hash-wasm 4.12.0, MIT — see NOTICE) sets globalThis.hashwasm.
		     Pinned by Subresource Integrity (commit 25, O17): if the served file
		     differs by one byte from the one recorded in NOTICE, the browser
		     refuses to run it — the link's password never meets unknown code.
		     tests/unit/vendored.test.mjs keeps file, NOTICE and this hash in step. -->
		<script src="/vendor/argon2.umd.min.js" integrity="sha384-tP0Wy54CKmng7i9EoTlPySD0hBx6Octj0VS6MfwlnUu111MPa+JLm0CCbep6XJ1W" crossorigin="anonymous"></script>
		<!-- The page's code lives in /s.js: the CSP (worker/src/routes.rs ›
		     share page) allows scripts from 'self' only — no inline script, no
		     inline style, no innerHTML (commit 24, docs/SECURITY-REVIEW.md › O1). -->
		<script type="module" src="/s.js"></script>
	</body>
</html>
