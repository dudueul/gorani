# The Gorani Cloudflare Worker: the only server component.
#
# It compiles to wasm32-unknown-unknown and runs on Cloudflare's runtime via
# the `worker` crate (workers-rs). Its job — and its boundary — is narrow:
#   • verify the caller (Cloudflare Access JWT),
#   • refuse any byte or name that is not already sealed (GV*),
#   • hold metadata in GoraniMemberDO (SQLite-backed Durable Objects),
#   • move ciphertext between clients and any S3-compatible bucket (MinIO…),
#   • never decrypt anything — with one exception the owner chose: the
#     content keys of protected video copies, which the FairPlay license
#     server must hand to Apple's DRM module (drm.rs, docs/DRM.md).
#
# Dependencies are added with `cargo add` so versions stay pinned in this
# file; see the [dependencies] section below.

[package]
name = "gorani-worker"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lib]
# wasm-bindgen exports need a cdylib; worker-build turns it into the module
# wrangler uploads (build/worker/shim.mjs + index_bg.wasm).
crate-type = ["cdylib"]

[dependencies]
gorani-formats = { version = "0.1.0", path = "../crates/formats" }
gorani-s3 = { version = "0.1.0", path = "../crates/s3" }
futures-util = "0.3" # StreamExt::next — the backup job reads objects as streams (O9)
js-sys = "0.3"
serde = "1.0.229"
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
worker = "0.8.7"

# The crypto crates under gorani-formats draw randomness through getrandom;
# on wasm32 it needs its `js` feature (crypto.getRandomValues). Feature
# unification turns it on for the whole graph when building the worker; on
# host targets (clients, tests) it is inert.
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4.3"
rand_core = "0.6"
# Cloudflare Access signs its JWTs RS256 (auth.rs, commit 39k) — RustCrypto's
# RSA, used to VERIFY only. (It replaced p256 here, the ES256 that had been
# assumed.)
rsa = { version = "0.9", features = ["sha2"] }
# Protected copies (commit 40b, drm.rs, docs/DRM.md): the FairPlay license
# server, and the custody of content keys — sealed (AES-256-GCM) under a key
# derived (HKDF) from the DRM_KEY_SECRET Worker secret; HMAC signs a
# view-only link's media URLs.
gorani-fairplay = { version = "0.1.0", path = "../crates/fairplay" }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
